name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  check:
    name: Nix checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v20

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq ripgrep

      - name: Run architecture tests
        run: bash ./tests/architecture-test.sh

      - name: Run battery charge tests
        run: bash ./hosts/work-laptop/battery-charge-test.sh .

      - name: Run Brave reconciliation tests
        run: bash ./tests/brave-reconcile-test.sh

      - name: Run Dolphin extraction tests
        run: bash ./tests/dolphin-extract-test.sh

      - name: Run path flake regression tests
        run: bash ./tests/path-flake-regression-test.sh

      - name: Run Plasma panel tests
        run: bash ./tests/plasma-panel-test.sh

      - name: Check flake
        run: nix flake check --no-build
